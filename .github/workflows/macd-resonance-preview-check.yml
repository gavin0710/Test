name: Verify MACD Vercel public dashboard and history API
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/macd-resonance-preview-check.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm production HTML is public and contains independent structure ledger
        run: |
          set -euo pipefail
          base='https://macd-resonance-monitor.vercel.app'
          curl --location --retry 3 --retry-delay 2 --max-time 45 --fail --silent --show-error "$base/" -o /tmp/dashboard.html
          grep -q '四指共振' /tmp/dashboard.html
          grep -q 'structureLedger' /tmp/dashboard.html
          grep -q '新结构买1新建单元' /tmp/dashboard.html
          echo "LIVE_HTML_OK $(wc -c < /tmp/dashboard.html)"
      - name: Verify live archived API structure and all four indices
        run: |
          set -euo pipefail
          base='https://macd-resonance-monitor.vercel.app'
          curl --location --retry 3 --retry-delay 2 --max-time 45 --fail --silent --show-error "$base/api/latest" -o /tmp/latest.json
          curl --location --retry 3 --retry-delay 2 --max-time 45 --fail --silent --show-error "$base/api/history?period=101" -o /tmp/daily.json
          python - <<'PY'
          import json
          latest=json.load(open('/tmp/latest.json',encoding='utf-8'))
          daily=json.load(open('/tmp/daily.json',encoding='utf-8'))
          assert len(latest['data'])==4
          assert daily['period']=='101' and len(daily['data'])==4
          assert len(daily['data'][0]['101'])>=8763
          print('LIVE_API_OK',latest['generated_at_utc'],len(daily['data'][0]['101']))
          PY
