name: Verify MACD dashboard public preview

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/macd-resonance-preview-check.yml'
      - 'macd-resonance/index.html'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check dashboard is publicly served as HTML
        run: |
          set -euo pipefail
          url='https://raw.githack.com/gavin0710/Test/master/macd-resonance/index.html'
          for attempt in 1 2 3 4 5; do
            sleep 4
            status=$(curl --location --retry 2 --retry-delay 2 --max-time 30 --silent --show-error --output /tmp/preview.html --dump-header /tmp/headers.txt --write-out '%{http_code}' "$url" || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = 200 ] && grep -q 'MACD × 九转' /tmp/preview.html && grep -q 'multi-index' /tmp/preview.html; then break; fi
            # This page is Chinese. No magic marker required other than real dashboard source.
            if [ "$status" = 200 ] && grep -q '多指数信号矩阵' /tmp/preview.html && grep -q 'function calculate' /tmp/preview.html; then break; fi
          done
          grep -q '多指数信号矩阵' /tmp/preview.html
          grep -q 'function calculate' /tmp/preview.html
          grep -i 'content-type:' /tmp/headers.txt | tail -1
          echo "Dashboard HTML size: $(wc -c < /tmp/preview.html)"
      - name: Check public market snapshot resolves
        run: |
          set -euo pipefail
          url='https://raw.githack.com/gavin0710/Test/master/macd-resonance/data/latest.json'
          curl --location --retry 3 --retry-delay 4 --max-time 40 --fail --silent --show-error "$url" -o /tmp/latest.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/latest.json',encoding='utf-8'))
          assert len(data['data']) == 4
          print('Source:',data['source'])
          print('Last archive update:',data['generated_at_utc'])
          print('Series:',[(i, {k:len(v) for k,v in d.items()}) for i,d in enumerate(data['data'])])
          PY
      - name: Public preview verified
        run: echo 'Preview address https://raw.githack.com/gavin0710/Test/master/macd-resonance/index.html'
