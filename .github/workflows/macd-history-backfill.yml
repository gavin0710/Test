name: Backfill all available MACD index daily weekly history
on:
  workflow_dispatch:
  schedule:
    - cron: "12 21 * * 0"
  push:
    branches: [master]
    paths:
      - "macd-resonance/backfill.py"
      - "macd-resonance/commit-market-update.sh"
      - ".github/workflows/macd-history-backfill.yml"
permissions:
  contents: write
concurrency:
  group: macd-market-archives
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download historical daily and weekly K lines
        run: python macd-resonance/backfill.py
      - name: Rebase sources, recalculate analysis and publish them together
        run: bash macd-resonance/commit-market-update.sh backfill
