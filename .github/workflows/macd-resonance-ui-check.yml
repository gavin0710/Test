name: Browser smoke test for MACD four-chart dashboard
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/macd-resonance-ui-check.yml"
      - "macd-resonance/index.html"
      - "macd-resonance/verify-ledger-ui.js"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/macd-resonance-ui-check.yml"
      - "macd-resonance/index.html"
      - "macd-resonance/verify-ledger-ui.js"
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression-test MACD and independent structure ledger
        run: |
          node macd-resonance/verify.js
          node macd-resonance/verify-ledger-history.js
      - name: Install headless Chromium
        run: |
          npm install --prefix /tmp/macd-ledger-v2 --no-save playwright
          /tmp/macd-ledger-v2/node_modules/.bin/playwright install chromium
      - name: Validate actual desktop and mobile four-chart interfaces using archived OHLC
        run: node macd-resonance/verify-ledger-ui.js
