name: MACD four-index synchronized replay acceptance
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/macd-four-chart-replay-acceptance.yml"
      - "macd-resonance/index.html"
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MACD_BASE_URL: https://macd-resonance-monitor.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/macd-ledger-v2 --no-save playwright
          /tmp/macd-ledger-v2/node_modules/.bin/playwright install chromium
      - name: Wait for the published HTML to match the tested revision
        run: |
          for attempt in {1..12}; do
            if curl --silent --show-error --fail --max-time 10 "$MACD_BASE_URL/?verify=$GITHUB_SHA-$attempt" -o /tmp/macd-production.html \
               && cmp -s /tmp/macd-production.html macd-resonance/index.html; then
              exit 0
            fi
            sleep 5
          done
          echo "The production alias does not serve this revision."
          exit 1
      - name: Verify production navigation, ledger and replay on desktop and mobile
        run: node macd-resonance/verify-ledger-ui.js
