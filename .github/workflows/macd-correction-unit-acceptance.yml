name: Correction signal-unit accounting branch acceptance
on:
  push:
    branches:
      - fix/macd-correction-signal-unit-counts
    paths:
      - 'macd-resonance/index.html'
      - 'macd-resonance/verify.js'
      - 'macd-resonance/verify-ledger-history.js'
      - 'macd-resonance/verify-ledger-ui.js'
      - '.github/workflows/macd-correction-unit-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MACD core regression
        run: node macd-resonance/verify.js
      - name: 24 real history and 7-versus-22 regression
        run: node macd-resonance/verify-ledger-history.js
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/macd-ledger-v2 --no-save playwright
          /tmp/macd-ledger-v2/node_modules/.bin/playwright install chromium
      - name: Browser test desktop mobile corrected signal count
        run: node macd-resonance/verify-ledger-ui.js
