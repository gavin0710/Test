name: MACD lifecycle dashboard production acceptance
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/macd-lifecycle-prod-acceptance.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression-test trading state machine
        run: node macd-resonance/verify.js
      - name: Install Chromium browser
        run: |
          npm install --prefix /tmp/macd-check --no-save playwright
          /tmp/macd-check/node_modules/.bin/playwright install chromium
      - name: Check LIVE production 24-period history, matched exits and stops
        run: |
          node <<'NODE'
          const {chromium}=require('/tmp/macd-check/node_modules/playwright');
          const assert=require('node:assert/strict');
          (async()=>{
           const browser=await chromium.launch({args:['--no-sandbox']});
           try {
            const page=await browser.newPage({viewport:{width:1440,height:1024}});
            const jsErrors=[];page.on('pageerror',e=>jsErrors.push(e.message));
            const url='https://macd-resonance-monitor.vercel.app';
            const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            assert.equal(resp.status(),200);console.log('PROD_HTTP',resp.status());
            await page.waitForFunction(()=>document.querySelector('#status')?.textContent?.includes('24/24'),null,{timeout:60000});
            console.log('24_SIGNAL_CELLS',await page.locator('#status').innerText());
            assert.equal(await page.locator('canvas.kplot').count(),4);
            assert.equal(await page.locator('canvas.mplot').count(),4);
            assert.equal(await page.locator('#statsbody tr').count(),24);
            const summaries=await page.locator('#statsoverall .metric').allInnerTexts();
            console.log('TOTALS',JSON.stringify(summaries));
            assert(summaries.some(x=>x.includes('钝化')),'No historical divergence counts');
            assert(summaries.some(x=>x.includes('买点')),'No buy count');
            assert(summaries.some(x=>x.includes('卖点')),'No sell count');
            const totals=await page.evaluate(()=>getHistoryStats().total);
            assert.equal(totals.watch,146,'Snapshot/indicator divergence count changed');
            assert.equal(totals.formed,84);
            assert.equal(totals.second,31);
            assert.equal(totals.third,7);
            assert.equal(totals.failStop,7);
            assert.equal(totals.buy,79);
            assert.equal(totals.sell,43);
            assert.equal(totals.open,14);
            assert.equal(totals.sellExits+totals.stopExits,totals.completed||totals.sellExits+totals.stopExits);
            console.log('SUMMARY_COUNTS',JSON.stringify(totals));
            assert.equal(await page.locator('#win-period-body tr').count(),6,'Six timeframe success-rate rows missing');
            assert.equal(await page.locator('#win-index-body tr').count(),24,'24 index/timeframe success-rate rows missing');
            const success=await page.evaluate(()=>{
              const {rows}=getHistoryStats();
              const getFor=p=>tradeSummary(rows.filter(r=>r.period===p).flatMap(r=>r.v.trades));
              const overall=tradeSummary(rows.flatMap(r=>r.v.trades));
              return {overall,periods:Object.fromEntries(['15','60','90','120','D','W'].map(p=>[p,getFor(p)]))};
            });
            assert.equal(success.overall.completed,14);
            assert.equal(success.overall.wins,6);
            assert.equal(success.overall.losses,8);
            assert(Math.abs(success.overall.winRate-42.857142857)<1e-5);
            assert.equal(success.periods['15'].completed,3);
            assert.equal(success.periods['15'].wins,0);
            assert.equal(success.periods.D.completed,2);
            assert.equal(success.periods.D.wins,1);
            assert.equal(success.periods.W.completed,8);
            assert.equal(success.periods.W.wins,5);
            assert.equal(success.periods['90'].winRate,null);
            assert.equal(success.periods['120'].winRate,null);
            assert.equal(await page.locator('#win-trades-body tr').count(),success.overall.completed);
            console.log('WIN_RATES',JSON.stringify(success));
            await page.locator('#stopfold summary').click();
            const stopRows=await page.locator('#stoprecords tbody tr').count();
            const openRows=await page.locator('#openrecords tbody tr').count();
            assert.equal(stopRows,totals.failStop);
            assert.equal(openRows,totals.open);
            console.log('STOP_RECORDS',stopRows,'OPEN_CYCLES',openRows);
            const vals=await page.locator('.difline').allInnerTexts();
            assert.equal(vals.length,4);
            assert(vals.every(v=>v.includes('DIF')&&v.includes('MACD柱')));
            console.log('DIF_VALUES',JSON.stringify(vals));
            const c=page.locator('#k0');await c.scrollIntoViewIfNeeded();const r=await c.boundingBox();
            await page.mouse.move(r.x+r.width*.43,r.y+r.height*.29);
            await page.waitForTimeout(150);
            const p1=await page.evaluate(()=>hoverPixelPrice);
            await page.mouse.move(r.x+r.width*.43,r.y+r.height*.65);
            await page.waitForTimeout(150);
            const p2=await page.evaluate(()=>hoverPixelPrice);
            assert(Number.isFinite(p1)&&Number.isFinite(p2)&&Math.abs(p1-p2)>1);
            console.log('CROSSHAIR',p1,p2);
            await page.locator('.periodbtn[data-p="60"]').click();
            assert.equal(await page.locator('#statsbody tr').count(),24,'Period switch did not retain stats');
            await page.locator('.periodbtn[data-p="D"]').click();
            const api=await page.request.get(url+'/api/latest');
            assert.equal(api.status(),200);
            const snapshot=await api.json();
            console.log('SNAPSHOT_DATE',snapshot.generated_at_utc);
            assert.equal(snapshot.data.length,4);
            assert.deepEqual(jsErrors,[]);
            console.log('NO_JS_ERRORS');
            await page.screenshot({path:'/tmp/macd-lifecycle-desktop.png',fullPage:true});
            const m=await browser.newPage({viewport:{width:390,height:844}});
            m.on('pageerror',e=>jsErrors.push('mobile '+e.message));
            const mobile=await m.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            assert.equal(mobile.status(),200);
            await m.waitForSelector('#statsbody tr');
            assert.equal(await m.locator('#statsbody tr').count(),24);
            assert.deepEqual(jsErrors,[]);
            console.log('MOBILE_OK');
            console.log('PRODUCTION_ACCEPTANCE_ALL_PASS');
           }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE
