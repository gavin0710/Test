name: Verify MACD Vercel production four-chart ledger
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/macd-vercel-prod-check.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install chromium
        run: |
          npm install --prefix /tmp/macd-vercel-check --no-save playwright
          /tmp/macd-vercel-check/node_modules/.bin/playwright install chromium
      - name: Verify live four-chart structure ledger, replay, and data APIs
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('/tmp/macd-vercel-check/node_modules/playwright');
          (async()=>{
           const base='https://macd-resonance-monitor.vercel.app';
           const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
           try{
            for(const viewport of [{width:1440,height:950},{width:390,height:844}]){
             const page=await browser.newPage({viewport});
             const errs=[];page.on('pageerror',e=>errs.push(e.message));
             const resp=await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
             assert.equal(resp.status(),200);
             await page.waitForFunction(()=>getSignal(0,'D')?.bars?.length>=8763,null,{timeout:70000});
             await page.waitForFunction(()=>document.querySelector('#status')?.textContent?.includes('24/24'),null,{timeout:70000});
             assert.equal(await page.locator('.chart-card:visible').count(),4);
             assert.equal(await page.locator('#statsbody tr').count(),24);
             const result=await page.evaluate(()=>{
              const v=getSignal(0,'D'),buy=v.events.find(e=>e.type==='buy'&&e.t.startsWith('2024-01-16'));
              const stop=buy&&v.events.find(e=>e.type==='stopLoss'&&e.structureId===buy.structureId);
              const rows=getHistoryStats().rows;
              return {buy:buy?.t,stop:stop?.t,completed:rows.reduce((x,r)=>x+r.v.trades.length,0),
               rendered:document.querySelectorAll('#win-trades-body tr').length,
               open:rows.reduce((x,r)=>x+r.v.positions.length,0),
               openShown:document.querySelectorAll('#openrecords tbody tr').length};
             });
             assert.equal(result.stop,'2024-01-22');
             assert.equal(result.completed,result.rendered);
             assert.equal(result.open,result.openShown);
             await page.locator('#view-replay').click();
             assert.equal(await page.locator('.chart-card:visible').count(),4);
             assert.equal(await page.locator('.confluence-item').count(),4);
             assert.deepEqual(errs,[]);
             const api=await page.request.get(base+'/api/latest');
             assert.equal(api.status(),200);
             assert.equal((await api.json()).data.length,4);
             console.log('LIVE_FOUR_CHART_LEDGER_PASS',JSON.stringify({viewport,...result}));
             await page.close();
            }
           }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
