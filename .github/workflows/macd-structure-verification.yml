name: MACD strict divergence regression tests
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "macd-resonance/index.html"
      - "macd-resonance/verify.js"
      - "macd-resonance/verify-ledger-history.js"
      - "macd-resonance/collect.py"
      - "macd-resonance/backfill.py"
      - "macd-resonance/verify-collect.py"
      - "macd-resonance/api/*"
      - "macd-resonance/lib/*"
      - "macd-resonance/vercel.json"
      - "macd-resonance/verify-site-access.mjs"
      - ".github/workflows/macd-structure-verification.yml"
  pull_request:
    branches: [master]
    paths:
      - "macd-resonance/index.html"
      - "macd-resonance/verify.js"
      - "macd-resonance/verify-ledger-history.js"
      - "macd-resonance/collect.py"
      - "macd-resonance/backfill.py"
      - "macd-resonance/verify-collect.py"
      - "macd-resonance/api/*"
      - "macd-resonance/lib/*"
      - "macd-resonance/vercel.json"
      - "macd-resonance/verify-site-access.mjs"
      - ".github/workflows/macd-structure-verification.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify password gate, protected resources and authenticated APIs
        run: node macd-resonance/verify-site-access.mjs
      - name: Verify all closed-price divergence rules and MACD projections
        run: node macd-resonance/verify.js
      - name: Verify independent structure ownership against all 24 real historical series
        run: node macd-resonance/verify-ledger-history.js
      - name: Verify snapshot publication and archive fallback
        run: python3 macd-resonance/verify-collect.py
