name: MACD resonance market data

on:
  workflow_dispatch:
  schedule:
    # 01:00-07:59 UTC is 09:00-15:59 China Standard Time; Mon-Fri.
    # Runs are best-effort, not a guaranteed 15-minute live feed.
    - cron: "*/15 1-7 * * 1-5"
  push:
    branches: [master]
    paths:
      - "macd-resonance/collect.py"
      - "macd-resonance/research-success.js"
      - "macd-resonance/commit-market-update.sh"
      - "macd-resonance/analysis-metrics.js"
      - "macd-resonance/analysis-patterns.js"
      - "macd-resonance/analysis-nine.js"
      - "macd-resonance/analysis-early.js"
      - "macd-resonance/index.html"
      - ".github/workflows/macd-resonance-data.yml"

permissions:
  contents: write

concurrency:
  group: macd-market-archives
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch and validate the sixteen source K-lines
        run: python macd-resonance/collect.py
      - name: Rebase sources, recalculate analysis and publish them together
        run: bash macd-resonance/commit-market-update.sh collect
