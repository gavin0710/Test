name: Compare normal structural stop persistence and reanchoring (read only)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - macd-resonance/research-structure-stop-regimes.js
      - .github/workflows/macd-structural-stop-research.yml
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Independently replay historical 24 index-period groups under six stop policies
        run: node macd-resonance/research-structure-stop-regimes.js
