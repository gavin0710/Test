name: MACD focused projection and project handoff acceptance
on:
  push:
    branches: [feat/macd-focused-projection-handoff]
    paths:
      - 'macd-resonance/index.html'
      - 'macd-resonance/verify.js'
      - 'macd-resonance/verify-ledger-ui.js'
      - 'macd-resonance/HANDOFF.md'
      - '.github/workflows/macd-focus-projection-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate signal logic and focus-only projection
        run: node macd-resonance/verify.js
      - name: Validate all 24 historical ledgers
        run: node macd-resonance/verify-ledger-history.js
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/macd-ledger-v2 --no-save playwright
          /tmp/macd-ledger-v2/node_modules/.bin/playwright install chromium
      - name: Desktop and mobile UI projection acceptance
        run: node macd-resonance/verify-ledger-ui.js
      - name: Handoff document checked in
        run: |
          test -s macd-resonance/HANDOFF.md
          grep -q '推演只在重点观察期出现' macd-resonance/HANDOFF.md
