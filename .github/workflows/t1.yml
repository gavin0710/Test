name: Shanghai T+1

on:
  push:
    branches: [master]
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect T+1
        id: collect
        continue-on-error: true
        run: python scraper.py
      - name: Commit live snapshot
        run: |
          git config user.name 'Data Bot'
          git config user.email 'bot@github-actions'
          git add data/live.json || true
          git diff --staged --quiet || git commit -m "data: Shanghai T+1 $(date -u '+%Y-%m-%d')"
          git push
      - name: Fail if T+1 missing
        if: steps.collect.outcome != 'success'
        run: exit 1
